name: ClawdDay
options:
  bundleIdPrefix: com.myla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ClawdDay:
    type: application
    platform: iOS
    sources:
      - path: ClawdDay
      - path: Shared
    dependencies:
      - target: ClawdDayWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myla.clawdday
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  ClawdDayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ClawdDayWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myla.clawdday.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClawdDay
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
