name: ClawdDay
options:
  bundleIdPrefix: com.myla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ClawdDay:
    type: application
    platform: iOS
    sources:
      - path: ClawdDay
      - path: Shared
    dependencies:
      - target: ClawdDayWidgetExtension
      - target: ClawdDayReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myla.clawdday
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "用来判断你到了哪个地点，好自动切换当前状态。"
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "选「始终允许」，app 没打开的时候到了实验室或者回到家也能自动切换状态；位置只留在你手机上。"

  ClawdDayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ClawdDayWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myla.clawdday.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClawdDay
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  ClawdDayReport:
    type: app-extension
    platform: iOS
    sources:
      - path: ClawdDayReport
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myla.clawdday.report
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClawdDayReport
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
